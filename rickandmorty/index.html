<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rick and Morty | Personajes</title>
    <link rel="stylesheet" href="css/style.css" />
    <script src="js/script.js" defer></script>
  </head>
  <body>
    <header>
      <h1>Rick and Morty</h1>
      <p>Personajes de la serie. Selecciona uno para ver sus datos.</p>
    </header>

    <main>
      <p id="message" role="status" aria-live="polite"></p>
      <div id="spinner" class="spinner" hidden aria-label="Cargando"></div>
      <div id="content" aria-label="Lista de personajes"></div>

      <nav class="pagination" aria-label="Paginación">
        <button id="prev" type="button">Anterior</button>
        <span id="page-number"></span>
        <button id="next" type="button">Siguiente</button>
      </nav>
    </main>
  </body>
</html>
